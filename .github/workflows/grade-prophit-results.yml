name: Grade PropHit Results

on:
  workflow_dispatch:
    inputs:
      grade_date:
        description: "Optional date to grade, YYYY-MM-DD. Leave blank for automatic detection."
        required: false
        type: string
  schedule:
    # 7:30 AM UTC = 3:30 AM ET during daylight saving time.
    # This is late enough for most MLB games to be final.
    - cron: "30 7 * * *"

permissions:
  contents: write

jobs:
  grade-results:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify projection file exists
        run: |
          test -f data/prophit_latest.json || (echo "Missing data/prophit_latest.json" && exit 1)

      - name: Run PropHit daily grader
        env:
          PROPHIT_GRADE_DATE: ${{ github.event.inputs.grade_date }}
        run: |
          python prophit_grade_daily.py

      - name: Commit updated grade file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prophit_grades.json
          git commit -m "Update PropHit daily grades" || echo "No grade changes to commit"
          git push
