name: Run PropHit Model

on:
  workflow_dispatch:
  schedule:
    # Runs hourly from 11 AM ET through 10 PM ET during Eastern Daylight Time.
    # GitHub Actions uses UTC.
    - cron: "0 15-2 * * *"

permissions:
  contents: write

concurrency:
  group: prophit-model-run
  cancel-in-progress: true

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy openpyxl

      - name: Run PropHit model
        timeout-minutes: 25
        run: |
          python prophit_model_full_day_freeze_update.py

      - name: Verify output files
        run: |
          echo "Checking data folder..."
          ls -lah data || true

          echo "Preview prophit_latest.json..."
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/prophit_latest.json")

          if not path.exists():
              raise FileNotFoundError("data/prophit_latest.json was not created")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              print("JSON format: object")
              print("Top-level keys:", list(data.keys()))
              if "meta" in data:
                  print("Meta:", data["meta"])
              players = data.get("players", [])
              print("Player count:", len(players))
          elif isinstance(data, list):
              print("JSON format: list")
              print("Player count:", len(data))
          else:
              raise TypeError(f"Unexpected JSON format: {type(data)}")

          print("JSON verified successfully.")
          PY

      - name: Commit and push updated model output
        run: |
          git config --global user.email "prophit-bot@example.com"
          git config --global user.name "prophit-bot"

          git add data/prophit_latest.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update PropHit model output"
            git push
          fi
