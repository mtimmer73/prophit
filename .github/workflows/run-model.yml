name: Run PropHit Model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install requests pandas numpy

      - name: Run model
        run: python prophit_model_full_day_freeze_update.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add data/prophit_latest.json
          git commit -m "Auto update model" || echo "No changes"
          git push
