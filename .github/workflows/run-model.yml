name: Run PropHit Model and Deploy UI

on:
  workflow_dispatch:

  schedule:
    # Runs daily. Adjust later if needed.
    - cron: "5 15 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prophit-run-model-deploy
  cancel-in-progress: false

jobs:
  run-model-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests openpyxl numpy pytz

      - name: Show repo structure
        run: |
          echo "Repo root:"
          pwd
          echo ""
          echo "Top-level files:"
          ls -la
          echo ""
          echo "Scripts:"
          ls -la scripts || true
          echo ""
          echo "Data:"
          ls -la data || true
          echo ""
          echo "Outputs:"
          ls -la outputs || true
          echo ""
          echo "Output grades:"
          ls -la outputs/grades || true
          echo ""
          echo "Docs:"
          ls -la docs || true

      - name: Run PropHit model
        env:
          TARGET_DATE: ""
        run: |
          set -euo pipefail

          if [ -f "prophit_model_full_day_freeze_update.py" ]; then
            echo "Running prophit_model_full_day_freeze_update.py"
            python prophit_model_full_day_freeze_update.py
          elif [ -f "scripts/prophit_model_full_day_freeze_update.py" ]; then
            echo "Running scripts/prophit_model_full_day_freeze_update.py"
            python scripts/prophit_model_full_day_freeze_update.py
          elif [ -f "scripts/run_prophit_model.py" ]; then
            echo "Running scripts/run_prophit_model.py"
            python scripts/run_prophit_model.py
          elif [ -f "run_prophit_model.py" ]; then
            echo "Running run_prophit_model.py"
            python run_prophit_model.py
          else
            echo "ERROR: Could not find PropHit model script."
            echo "Expected one of:"
            echo "  prophit_model_full_day_freeze_update.py"
            echo "  scripts/prophit_model_full_day_freeze_update.py"
            echo "  scripts/run_prophit_model.py"
            echo "  run_prophit_model.py"
            exit 1
          fi

      - name: Verify key UI/data files
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          required_any = [
              Path("data/prophit_latest.json"),
              Path("data/prophit_all_players.json"),
              Path("outputs/prophit_latest.json"),
              Path("outputs/latest.json"),
              Path("docs/data/prophit_latest.json"),
          ]

          found = []

          for path in required_any:
              if path.exists():
                  found.append(path)
                  try:
                      with path.open("r", encoding="utf-8") as f:
                          json.load(f)
                  except Exception as exc:
                      raise SystemExit(f"ERROR: {path} exists but is not valid JSON: {exc}")

          if not found:
              raise SystemExit("ERROR: No model output JSON files found.")

          print("Verified model JSON outputs:")
          for path in found:
              print(f" - {path}")
          PY

      - name: Make live JSON aliases
        run: |
          set -euo pipefail

          mkdir -p data
          mkdir -p docs/data
          mkdir -p proppulse-ui-app/public/data
          mkdir -p outputs/grades

          if [ -f "scripts/publish_prophit_live_json.py" ]; then
            echo "Running scripts/publish_prophit_live_json.py"
            python scripts/publish_prophit_live_json.py
          else
            echo "ERROR: scripts/publish_prophit_live_json.py not found"
            exit 1
          fi

      - name: Verify live JSON has grades
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("data/prophit_today.json")

          if not path.exists():
              raise SystemExit("ERROR: data/prophit_today.json was not created.")

          with path.open("r", encoding="utf-8") as f:
              payload = json.load(f)

          performance = payload.get("performance", {})
          grades = performance.get("grades", {})
          all_time = grades.get("all_time", {})
          recent = grades.get("recent_10_days", {})

          print("Live JSON grade check:")
          print(f" - grade_file_count: {payload.get('grade_file_count')}")
          print(f" - all_time: {all_time}")
          print(f" - recent_10_days: {recent}")

          if payload.get("grade_file_count", 0) == 0:
              print("WARNING: Live JSON was created, but no grade rows were loaded.")
              print("This usually means no grade files were found in outputs/grades or data/graded.")

          if "players" not in payload:
              raise SystemExit("ERROR: data/prophit_today.json is missing players.")
          PY

      - name: Build static UI files if build script exists
        run: |
          set -euo pipefail

          if [ -f "package.json" ]; then
            echo "package.json found."

            if grep -q '"build"' package.json; then
              echo "Installing npm dependencies and building UI..."
              npm install
              npm run build
            else
              echo "No npm build script found. Skipping UI build."
            fi
          else
            echo "No package.json found. Skipping UI build."
          fi

      - name: Commit and push updated model/UI data
        run: |
          set -euo pipefail

          git config user.name "prophit-bot"
          git config user.email "prophit-bot@example.com"

          # Prevent oversized raw ledgers from being committed.
          {
            echo ""
            echo "# PropHit grading raw ledgers can exceed GitHub's 100 MB file limit"
            echo "outputs/grades/graded_ledger.json"
            echo "outputs/grades/*graded_ledger*.json"
            echo "outputs/grades/*ledger*.json"
          } >> .gitignore

          rm -f outputs/grades/graded_ledger.json || true
          rm -f outputs/grades/*graded_ledger*.json || true
          rm -f outputs/grades/*ledger*.json || true

          echo "Changed files before add:"
          git status --short

          # Core model outputs.
          git add data/*.json || true
          git add docs/data/*.json || true
          git add proppulse-ui-app/public/data/*.json || true
          git add outputs/*.json || true
          git add outputs/*.xlsx || true
          git add outputs/snapshots/*.json || true
          git add outputs/snapshots/*.xlsx || true

          # Grade files used by player-specific correlations/performance.
          git add outputs/grades/*.json || true
          git add outputs/grades/*.xlsx || true
          git add data/graded/*.json || true
          git add data/graded_results.json || true

          # UI files.
          git add index.html || true
          git add docs/index.html || true
          git add assets || true
          git add proppulse-ui-app || true

          git add .gitignore || true

          # Unstage oversized raw ledgers if any glob caught them.
          git reset -- outputs/grades/graded_ledger.json 2>/dev/null || true
          git reset -- outputs/grades/*graded_ledger*.json 2>/dev/null || true
          git reset -- outputs/grades/*ledger*.json 2>/dev/null || true

          echo "Staged files:"
          git diff --cached --name-only

          # Hard safety check: refuse files over 95 MB.
          python - <<'PY'
          import subprocess
          from pathlib import Path

          result = subprocess.run(
              ["git", "diff", "--cached", "--name-only"],
              check=True,
              capture_output=True,
              text=True,
          )

          too_large = []

          for name in result.stdout.splitlines():
              path = Path(name)
              if path.exists() and path.is_file() and path.stat().st_size > 95 * 1024 * 1024:
                  too_large.append(f"{name} ({path.stat().st_size / 1024 / 1024:.1f} MB)")

          if too_large:
              raise SystemExit("ERROR: Refusing to commit oversized files:\n" + "\n".join(too_large))
          PY

          if git diff --cached --quiet; then
            echo "No model/UI data changes to commit."
          else
            git commit -m "Update PropHit model and live UI data"
            git push
          fi

      - name: Refresh repo after commit
        run: |
          git pull --ff-only || true

      - name: Prepare GitHub Pages artifact
        run: |
          set -euo pipefail

          rm -rf _site
          mkdir -p _site

          if [ -d "docs" ]; then
            echo "Using docs folder for GitHub Pages artifact."
            cp -R docs/. _site/
          else
            echo "No docs folder found. Using repo root fallback."
            cp -R . _site/
          fi

          # Ensure root index exists.
          if [ ! -f "_site/index.html" ] && [ -f "index.html" ]; then
            cp index.html _site/index.html
          fi

          # Ensure live data exists inside Pages artifact.
          mkdir -p _site/data

          if [ -f "data/prophit_today.json" ]; then
            cp data/prophit_today.json _site/data/prophit_today.json
          fi

          if [ -f "data/prophit_latest.json" ]; then
            cp data/prophit_latest.json _site/data/prophit_latest.json
          fi

          if [ -f "data/prophit_all_players.json" ]; then
            cp data/prophit_all_players.json _site/data/prophit_all_players.json
          fi

          if [ -f "data/prophit_performance_summary.json" ]; then
            cp data/prophit_performance_summary.json _site/data/prophit_performance_summary.json
          fi

          if [ -f "data/prophit_schema.json" ]; then
            cp data/prophit_schema.json _site/data/prophit_schema.json
          fi

          echo "Prepared _site:"
          find _site -maxdepth 3 -type f | sort | head -200

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy UI to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
