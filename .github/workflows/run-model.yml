name: Run PropHit Model

on:
  workflow_dispatch:
  schedule:
    - cron: "0 14 * * *"

permissions:
  contents: write

jobs:
  run-model:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install openpyxl

      - name: Run model
        run: python prophit_model_full_day_freeze_update.py

      - name: Commit updated JSON
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add prophit-ui-app/public/data/prophit_latest.json
          git add prophit-ui-app/public/data/prophit_performance_summary.json
          git commit -m "Auto update model" || echo "No changes to commit"
          git push
