name: Run PropHit Model and Deploy UI

on:
  workflow_dispatch:
  schedule:
    # 7:00 AM ET during daylight time = 11:00 UTC
    - cron: "0 11 * * *"

    # Hourly 11:00 AM–10:00 PM ET during daylight time.
    # GitHub Actions uses UTC, so this is split across UTC midnight.
    # 11 AM–7 PM ET = 15:00–23:00 UTC
    - cron: "0 15-23 * * *"

    # 8 PM–10 PM ET = 00:00–02:00 UTC next UTC day
    - cron: "0 0-2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prophit-model-and-ui
  cancel-in-progress: true

jobs:
  run-model-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy openpyxl

      - name: Run PropHit model
        timeout-minutes: 25
        run: |
          python prophit_model_full_day_freeze_update.py

      - name: Verify model output
        run: |
          echo "Checking data folder..."
          ls -lah data || true

          echo "Verifying data/prophit_latest.json..."
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/prophit_latest.json")

          if not path.exists():
              raise FileNotFoundError("data/prophit_latest.json was not created")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              print("JSON format: object")
              print("Top-level keys:", list(data.keys()))
              print("Meta:", data.get("meta", {}))
              players = data.get("players", [])
              print("Player count:", len(players))
          elif isinstance(data, list):
              print("JSON format: list")
              print("Player count:", len(data))
          else:
              raise TypeError(f"Unexpected JSON format: {type(data)}")

          print("JSON verified successfully.")
          PY

      - name: Commit updated model output
        run: |
          git config --global user.email "prophit-bot@example.com"
          git config --global user.name "prophit-bot"

          git add data/prophit_latest.json || true
          git add data/prophit_all_players.json || true
          git add data/prophit_schema.json || true
          git add data/prophit_performance_summary.json || true
          git add outputs || true

          if git diff --cached --quiet; then
            echo "No model output changes to commit."
          else
            git commit -m "Auto update PropHit model output"
            git push
          fi

      - name: Refresh repo after model commit
        run: |
          git pull --rebase || true

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf site
          mkdir -p site

          cp index.html site/index.html

          if [ -d data ]; then
            cp -r data site/data
          fi

          if [ -d assets ]; then
            cp -r assets site/assets
          fi

          if [ -f favicon.svg ]; then
            cp favicon.svg site/favicon.svg
          fi

          if [ -f icons.svg ]; then
            cp icons.svg site/icons.svg
          fi

          if [ -f index-Bcz-ZUx5.js ]; then
            cp index-Bcz-ZUx5.js site/index-Bcz-ZUx5.js
          fi

          if [ -f index-nqMpl4T3.css ]; then
            cp index-nqMpl4T3.css site/index-nqMpl4T3.css
          fi

          echo "Prepared GitHub Pages artifact:"
          ls -lah site
          echo "Prepared data folder:"
          ls -lah site/data || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy UI to GitHub Pages
        uses: actions/deploy-pages@v4
