name: Run PropHit Model and Deploy UI

on:
  workflow_dispatch:
    inputs:
      target_date:
        description: "Optional target date in YYYY-MM-DD. Leave blank for today ET."
        required: false
        default: ""

  schedule:
    # 7:05 AM ET during daylight time = 11:05 UTC.
    - cron: "5 11 * * *"

    # Hourly refreshes from 11:05 AM-10:05 PM ET during daylight time = 15:05-02:05 UTC.
    - cron: "5 15-23 * * *"
    - cron: "5 0-2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prophit-run-model-and-deploy
  cancel-in-progress: false

jobs:
  run-model-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python dependencies
        shell: bash
        run: |
          set -e
          python -m pip install --upgrade pip

          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install requests pandas numpy python-dateutil pytz beautifulsoup4 lxml openpyxl
          fi

      - name: Show repo structure
        shell: bash
        run: |
          echo "Current branch:"
          git branch --show-current
          echo "Top-level files:"
          find . -maxdepth 2 -type f | sort | sed 's#^./##' | head -200

      - name: Run PropHit model
        shell: bash
        env:
          TARGET_DATE: ${{ github.event.inputs.target_date }}
        run: |
          set -euo pipefail

          echo "TARGET_DATE=${TARGET_DATE:-}"

          if [ -f scripts/run_model.py ]; then
            python scripts/run_model.py ${TARGET_DATE:+--date "$TARGET_DATE"}
          elif [ -f scripts/prophit_model.py ]; then
            python scripts/prophit_model.py ${TARGET_DATE:+--date "$TARGET_DATE"}
          elif [ -f prophit_model.py ]; then
            python prophit_model.py ${TARGET_DATE:+--date "$TARGET_DATE"}
          elif [ -f run_model.py ]; then
            python run_model.py ${TARGET_DATE:+--date "$TARGET_DATE"}
          elif [ -f model.py ]; then
            python model.py ${TARGET_DATE:+--date "$TARGET_DATE"}
          else
            echo "ERROR: Could not find a model script to run."
            echo "Expected one of: scripts/run_model.py, scripts/prophit_model.py, prophit_model.py, run_model.py, model.py"
            exit 1
          fi

      - name: Build static UI files if build script exists
        shell: bash
        run: |
          set -euo pipefail

          if [ -f package.json ]; then
            echo "package.json found. Installing and building UI."
            npm install
            npm run build --if-present
          elif [ -f scripts/build_ui.py ]; then
            echo "scripts/build_ui.py found. Building UI."
            python scripts/build_ui.py
          elif [ -f build_ui.py ]; then
            echo "build_ui.py found. Building UI."
            python build_ui.py
          else
            echo "No separate UI build script found. Skipping build step."
          fi

      - name: Verify key UI/data files
        shell: bash
        run: |
          echo "Files changed/generated after model run:"
          git status --short

          echo "Looking for common UI/data outputs:"
          find . -maxdepth 3 \( -name "*.json" -o -name "*.csv" -o -name "*.html" \) | sort | head -200

      - name: Commit and push updated model/UI data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Stage generated model/UI data and any updated static files.
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit. Model/UI files are already current."
            exit 0
          fi

          git commit -m "Update PropHit model data"

          # Avoid exit code 128 by syncing with main before push.
          git fetch origin main
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Final status
        if: always()
        shell: bash
        run: |
          echo "Workflow completed with status: ${{ job.status }}"
          git status --short || true
