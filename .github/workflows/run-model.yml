name: Run PropHit Model and Deploy UI

on:
  workflow_dispatch:

  # Deploy UI automatically when the site or this workflow changes.
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "assets/**"
      - "favicon.svg"
      - "icons.svg"
      - ".github/workflows/run-model.yml"

  schedule:
    # 7:17 AM ET during daylight time = 11:17 UTC
    - cron: "17 11 * * *"

    # Hourly 11:17 AM–10:17 PM ET during daylight time.
    # GitHub Actions uses UTC.
    # 11 AM–7 PM ET = 15:17–23:17 UTC
    # 8 PM–10 PM ET = 00:17–02:17 UTC
    - cron: "17 15-23,0-2 * * *"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: prophit-model-and-ui
  cancel-in-progress: true

jobs:
  run-model-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pandas numpy openpyxl

      - name: Decide whether to run model
        id: model_decision
        run: |
          echo "Event name: ${{ github.event_name }}"

          if [ "${{ github.event_name }}" = "push" ]; then
            echo "UI/workflow push detected. Skipping model run and only deploying UI."
            echo "run_model=false" >> "$GITHUB_OUTPUT"
          else
            echo "Manual or scheduled run detected. Running model before deploy."
            echo "run_model=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run PropHit model
        if: steps.model_decision.outputs.run_model == 'true'
        timeout-minutes: 25
        run: |
          python prophit_model_full_day_freeze_update.py

      - name: Verify model output
        if: steps.model_decision.outputs.run_model == 'true'
        run: |
          echo "Checking data folder..."
          ls -lah data || true

          echo "Checking outputs folder..."
          ls -lah outputs || true

          echo "Checking snapshots folder..."
          ls -lah outputs/snapshots || true

          echo "Verifying data/prophit_latest.json..."
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("data/prophit_latest.json")

          if not path.exists():
              raise FileNotFoundError("data/prophit_latest.json was not created")

          with path.open("r", encoding="utf-8") as f:
              data = json.load(f)

          if isinstance(data, dict):
              print("JSON format: object")
              print("Top-level keys:", list(data.keys()))
              print("Meta:", data.get("meta", {}))
              players = data.get("players", [])
              print("Player count:", len(players))
          elif isinstance(data, list):
              print("JSON format: list")
              print("Player count:", len(data))
          else:
              raise TypeError(f"Unexpected JSON format: {type(data)}")

          print("JSON verified successfully.")
          PY

      - name: Commit updated model output and snapshots
        if: steps.model_decision.outputs.run_model == 'true'
        run: |
          git config --global user.email "prophit-bot@example.com"
          git config --global user.name "prophit-bot"

          # Live UI data
          git add data/prophit_latest.json || true
          git add data/prophit_all_players.json || true
          git add data/prophit_schema.json || true
          git add data/prophit_performance_summary.json || true
          git add data/prophit_validation_rows.json || true

          # Force-add grading snapshots even if outputs is ignored by .gitignore
          git add -f outputs/snapshots/*.json || true
          git add -f outputs/snapshots/*.xlsx || true

          # Force-add useful run artifacts
          git add -f outputs/prophit_today.xlsx || true
          git add -f outputs/prophit_run_log.json || true
          git add -f outputs/prophit_freeze_state.json || true

          if git diff --cached --quiet; then
            echo "No model output changes to commit."
          else
            git commit -m "Auto update PropHit model output and snapshots"
            git pull --rebase || true
            git push
          fi

      - name: Refresh repo after model commit
        if: steps.model_decision.outputs.run_model == 'true'
        run: |
          git pull --rebase || true

      - name: Verify site files before deploy
        run: |
          echo "Current branch:"
          git branch --show-current

          echo "Current commit:"
          git rev-parse --short HEAD

          echo "Root files:"
          ls -lah

          echo "Data files:"
          ls -lah data || true

          if [ ! -f index.html ]; then
            echo "index.html is missing"
            exit 1
          fi

          if [ ! -f data/prophit_latest.json ]; then
            echo "Warning: data/prophit_latest.json is missing. Site will deploy, but board may not load data."
          fi

      - name: Prepare GitHub Pages artifact
        run: |
          rm -rf site
          mkdir -p site

          cp index.html site/index.html

          # Keep custom domain attached after every deploy.
          echo "prophitlab.com" > site/CNAME

          if [ -d data ]; then
            cp -r data site/data
          fi

          if [ -d assets ]; then
            cp -r assets site/assets
          fi

          if [ -f favicon.svg ]; then
            cp favicon.svg site/favicon.svg
          fi

          if [ -f icons.svg ]; then
            cp icons.svg site/icons.svg
          fi

          # Optional Vite/static build files if present.
          if [ -f index-Bcz-ZUx5.js ]; then
            cp index-Bcz-ZUx5.js site/index-Bcz-ZUx5.js
          fi

          if [ -f index-nqMpl4T3.css ]; then
            cp index-nqMpl4T3.css site/index-nqMpl4T3.css
          fi

          echo "Prepared GitHub Pages artifact:"
          ls -lah site

          echo "Prepared site/data folder:"
          ls -lah site/data || true

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - name: Deploy UI to GitHub Pages
        uses: actions/deploy-pages@v4
